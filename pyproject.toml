[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-optimizer"
version = "0.1.0"
description = "Turn raw prompt ideas into structured, optimized prompts"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Prompt Optimizer" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
prompt-optimizer = "prompt_optimizer.cli:main"
prompt-optimizer-web = "prompt_optimizer.web:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prompt_optimizer = ["ui/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

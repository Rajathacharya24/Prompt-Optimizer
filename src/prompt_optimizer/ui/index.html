<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prompt-optimizer — terminal</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #101010;
    --border: #2a2a2a;
    --grey: #9a9a9a;
    --grey-dim: #5f5f5f;
    --grey-dark: #3a3a3a;
    --yellow: #ffd23f;
    --yellow-dim: #8a7420;
    --mono: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--grey);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.55;
    display: flex;
    flex-direction: column;
    padding: 14px;
  }

  /* subtle CRT scanlines */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.012) 0px,
      rgba(255, 255, 255, 0.012) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 99;
  }

  /* ── window chrome ─────────────────────────── */
  .term {
    flex: 1;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    background: var(--panel);
    min-height: 0;
    box-shadow: 0 0 0 1px #000, 0 10px 40px rgba(0,0,0,.6);
  }
  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    background: #0d0d0d;
    user-select: none;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot.g1 { background: var(--grey-dark); }
  .dot.g2 { background: var(--grey-dim); }
  .dot.g3 { background: var(--yellow); }
  .titlebar .t {
    margin: 0 auto;
    color: var(--grey-dim);
    font-size: 12px;
    letter-spacing: .5px;
  }
  .titlebar .v { color: var(--yellow-dim); font-size: 12px; }

  /* ── scrollback ────────────────────────────── */
  #screen {
    flex: 1;
    overflow-y: auto;
    padding: 18px 20px 12px;
    min-height: 0;
    scrollbar-width: thin;
    scrollbar-color: var(--grey-dark) transparent;
  }
  #screen::-webkit-scrollbar { width: 8px; }
  #screen::-webkit-scrollbar-thumb { background: var(--grey-dark); }

  .banner { color: var(--yellow); white-space: pre; }
  .dim { color: var(--grey-dim); }
  .line { white-space: pre-wrap; word-break: break-word; }
  .echo .pfx { color: var(--yellow); }
  .boot { color: var(--grey-dim); }
  .boot .tag { color: var(--grey-dark); }
  .boot .ok { color: var(--yellow); }
  .boot .hl { color: var(--grey); }

  .hr { color: var(--grey-dark); white-space: pre; overflow: hidden; }

  .out { white-space: pre-wrap; word-break: break-word; }
  .out .h { color: var(--yellow); font-weight: 700; }
  .out .body { color: var(--grey); }

  .meter { color: var(--grey-dim); }
  .meter .fill { color: var(--yellow); }
  .meter .empty { color: var(--grey-dark); }
  .meter .num { color: var(--grey); }
  .meter .k { color: var(--grey-dim); }

  .sugg { color: var(--grey-dim); }
  .sugg .b { color: var(--yellow); }

  .diaryline .b { color: var(--yellow); }
  .diaryline { color: var(--grey-dim); }
  .ye { color: var(--yellow); }
  .hl2 { color: var(--grey); }
  .out .h2 { color: var(--grey-dim); }

  .err { color: var(--yellow); }
  .err .b { color: var(--yellow); }

  .blink { animation: blink 1.05s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── input line ────────────────────────────── */
  .inputline {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 10px 20px 14px;
    border-top: 1px dashed var(--border);
    background: var(--panel);
  }
  .inputline .pfx { color: var(--yellow); white-space: nowrap; padding-top: 1px; }
  #idea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--grey);
    font: inherit;
    caret-color: var(--yellow);
    max-height: 40vh;
    line-height: 1.55;
  }
  #idea::placeholder { color: var(--grey-dark); }
  .cursor {
    color: var(--yellow);
    padding-top: 1px;
    user-select: none;
  }

  /* ── status bar (tmux style) ───────────────── */
  .statusbar {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--grey-dark);
    color: #0a0a0a;
    font-size: 12px;
    user-select: none;
  }
  .statusbar .seg { padding: 4px 10px; }
  .statusbar .brand { background: var(--yellow); color: #111; font-weight: 700; }
  .statusbar .fillhint { color: #d8d8d8; font-weight: 400; }
  .statusbar .spacer { flex: 1; }
  .btn {
    background: transparent;
    border: none;
    color: #e8e8e8;
    font: inherit;
    cursor: pointer;
    padding: 4px 10px;
  }
  .btn:hover, .btn:focus-visible { background: var(--yellow); color: #111; outline: none; }
  .btn.flash { background: var(--yellow); color: #111; }
</style>
</head>
<body>
  <div class="term">
    <div class="titlebar">
      <span class="dot g1"></span><span class="dot g2"></span><span class="dot g3"></span>
      <span class="t">you@prompt-optimizer — ~/ideas</span>
      <span class="v">v1.0</span>
    </div>

    <div id="screen" aria-live="polite"></div>

    <div class="inputline">
      <span class="pfx">➜ ~&nbsp;</span>
      <textarea id="idea" rows="1" spellcheck="false" autocomplete="off"
        placeholder="paste your raw idea, then press enter"></textarea>
      <span class="cursor blink">▊</span>
    </div>

    <div class="statusbar">
      <span class="seg brand">OPTIMIZER</span>
      <span class="seg fillhint">enter=run</span>
      <span class="seg fillhint">shift+enter=newline</span>
      <span class="seg fillhint">↑↓=history</span>
      <span class="spacer"></span>
      <button class="btn" id="logBtn">[ log ]</button>
      <button class="btn" id="copyBtn">[ copy ]</button>
      <button class="btn" id="clearBtn">[ clear ]</button>
    </div>
  </div>

<script>
(() => {
  const screen = document.getElementById("screen");
  const input = document.getElementById("idea");
  const copyBtn = document.getElementById("copyBtn");
  const clearBtn = document.getElementById("clearBtn");
  const logBtn = document.getElementById("logBtn");

  const history = [];
  let histIdx = -1;
  let lastPrompt = "";
  let busy = false;
  let iv = null; // interview state: {idea, plan, step, qi, answers, taskType}

  const BANNER = [
    "  ___  ___  _ __   ___ _   _ ___ _   _  ___  _ __",
    " | _ \\/ _ \\| '_ \\ / _ \\ | | / __| | | |/ _ \\| '_ \\",
    " |  _/ (_) | | | |  __/ |_| \\__ \\ |_| | (_) | | | |",
    " |_|  \\___/|_| |_|\\___|\\__, |___/\\__, |\\___/|_| |_|",
    "                        |___/     |___/",
  ].join("\n");

  const esc = (s) => {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  };

  const append = (html, cls) => {
    const el = document.createElement("div");
    if (cls) el.className = cls;
    el.innerHTML = html;
    screen.appendChild(el);
    screen.scrollTop = screen.scrollHeight;
    return el;
  };

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  const fmtMeters = (a) => {
    const rows = [
      ["SCORE", a.overall_score],
      ["CLARITY", a.clarity_score],
      ["SPECIFIC", a.specificity_score],
      ["COMPLETE", a.completeness_score],
    ];
    return rows.map(([k, v]) => {
      const filled = Math.round(v / 100 * 10);
      const label = k.padEnd(9, " ");
      const f = "█".repeat(filled).padEnd(10, "░");
      return `<span class="k">${label}</span> <span class="fill">${"█".repeat(filled)}</span><span class="empty">${"░".repeat(10 - filled)}</span> <span class="num">${String(v).padStart(3, " ")}/100</span>`;
    }).join("\n");
  };

  const bootLine = async (tag, parts, delay) => {
    await sleep(delay);
    append(
      parts.map((p) =>
        `<span class="tag">[${tag}]</span> ${p}`
      ).join(" "),
      "boot"
    );
  };

  const renderResult = (r) => {
    append("<span class='hr'>" + "─".repeat(64) + "</span>");

    // optimized prompt with colored headers
    const out = document.createElement("div");
    out.className = "out";
    out.innerHTML = r.optimized_prompt.split("\n").map((line) => {
      if (line.startsWith("# ")) {
        return `<span class="h">${esc(line)}</span>`;
      }
      if (line === "") return "&nbsp;";
      return `<span class="body">${esc(line)}</span>`;
    }).join("\n");
    screen.appendChild(out);

    if (r.improvements_applied && r.improvements_applied.length) {
      append(`<span class="dim">improvements applied:</span>`, "line");
      r.improvements_applied.forEach((s) => {
        append(`  <span class="b">+</span> ${esc(s)}`, "sugg");
      });
    }

    if (r.analysis) {
      append(
        fmtMeters(r.analysis).split("\n").map((l) => `${l}`).join("\n"),
        "meter"
      );

      (r.analysis.detected_signals || []).slice(0, 4).forEach((s) => {
        append(`<span class="dim">  · signal: ${esc(s)}</span>`, "line");
      });

      (r.analysis.suggestions || []).forEach((s) => {
        append(`<span class="b">!</span> ${esc(s)}`, "sugg");
      });
    }

    append("<span class='hr'>" + "─".repeat(64) + "</span>");
    append(`<span class="dim">[ ${esc(String(r.optimized_prompt.length))} chars copied into buffer · type result below · enter=new idea ]</span>`, "line");
    screen.scrollTop = screen.scrollHeight;
  };

  const renderMarkdown = (md) => {
    append("<span class='hr'>" + "─".repeat(64) + "</span>");
    const out = document.createElement("div");
    out.className = "out";
    out.innerHTML = md.split("\n").map((line) => {
      if (line.startsWith("# ")) return `<span class="h">${esc(line)}</span>`;
      if (line.startsWith("## ")) return `<br><span class="h">${esc(line)}</span>`;
      if (line.startsWith("**day summary") || line.startsWith("**today:")) return `<span class="h2">${esc(line)}</span>`;
      if (line.startsWith("### ")) return `<span class="h">${esc(line)}</span>`;
      if (line === "") return "&nbsp;";
      return `<span class="body">${esc(line)}</span>`;
    }).join("\n");
    screen.appendChild(out);
    append("<span class='hr'>" + "─".repeat(64) + "</span>");
    screen.scrollTop = screen.scrollHeight;
  };

  const showLog = async () => {
    if (busy) return;
    busy = true;
    append(`<span class="dim">cat logs/daily_log.md …</span>`, "line");
    try {
      const res = await fetch("/api/log");
      const data = await res.json();
      renderMarkdown(data.markdown || "(empty)");
      const s = data.stats || {};
      append(
        `<span class="dim">today:</span> <span class="hl2">${s.sessions_today ?? 0} optimized</span> · ` +
        `<span class="hl2">${s.manual_today ?? 0} manual</span> · <span class="hl2">${s.minutes_today ?? 0} min</span> · ` +
        `<span class="ye">streak ${s.streak_days ?? 0}d</span> · lifetime ${s.total_entries ?? 0}`,
        "line"
      );
    } catch (e) {
      append(`<span class="b">[error]</span> ${esc(String(e.message || e))}`, "err");
    }
    busy = false;
    screen.scrollTop = screen.scrollHeight;
    input.focus();
  };

  const addManualLog = async (raw) => {
    busy = true;
    append(`<span class="pfx">➜ ~ </span><span class="body">${esc(raw)}</span>`, "line echo");
    const body = raw.replace(/^\/log\s*/i, "");
    const sep = body.indexOf("|");
    const what = sep >= 0 ? body.slice(0, sep).trim() : body.trim();
    const amount = sep >= 0 ? body.slice(sep + 1).trim() : "";
    if (!what && !amount) {
      append(`<span class="b">[warn]</span> usage: /log what you did | how much (e.g. /log built login page | 2 hrs)`, "err");
      busy = false;
      input.focus();
      return;
    }
    try {
      const res = await fetch("/api/log", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ what, amount }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      const mins = data.entry.minutes ? ` (${data.entry.minutes} min)` : "";
      append(`<span class="b">[diary ✓]</span> marked "${esc(what)}" — "${esc(amount)}"${mins} · streak ${data.stats.streak_days}d`, "diaryline");
    } catch (e) {
      append(`<span class="b">[error]</span> ${esc(String(e.message || e))}`, "err");
    }
    busy = false;
    input.focus();
  };

  const run = async () => {
    const raw = input.value.trim();
    if (!raw || busy) {
      if (!raw) append(`<span class="b">[warn]</span> empty input — nothing to optimize`, "err");
      return;
    }
    if (raw.toLowerCase().startsWith("/log")) {
      input.value = "";
      autoGrow();
      await addManualLog(raw);
      return;
    }
    if (raw.toLowerCase() === "/today" || raw.toLowerCase() === "/log view") {
      input.value = "";
      autoGrow();
      await showLog();
      return;
    }
    busy = true;
    history.push(raw);
    histIdx = history.length;

    append(`<span class="pfx">➜ ~ </span><span class="body">${esc(raw)}</span>`, "line echo");
    input.value = "";
    autoGrow();

    append("<span class='hr'>" + "─".repeat(64) + "</span>");
    await bootLine("parser", ["<span class='ok'>✓</span> reading raw idea…"], 120);

    let data;
    try {
      const res = await fetch("/api/optimize", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ idea: raw }),
      });
      data = await res.json();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    } catch (e) {
      append(`<span class="b">[error]</span> ${esc(String(e.message || e))}`, "err");
      busy = false;
      input.focus();
      return;
    }

    const a = data.analysis;
    const type = a ? a.task_type : "general";
    const sig = a && a.detected_signals ? a.detected_signals.length : 0;

    await bootLine("analyze", [`<span class='ok'>✓</span> <span class='hl'>task_type: ${esc(type)}</span>`, `${sig} signals`], 180);
    if (a) {
      await bootLine("analyze", [`<span class='ok'>✓</span> clarity ${a.clarity_score} · specificity ${a.specificity_score} · completeness ${a.completeness_score}`], 180);
    }
    await bootLine("planner", ["<span class='ok'>✓</span> blueprint built · steps + quality bar locked"], 160);
    await bootLine("renderer", ["<span class='ok'>✓</span> optimized prompt compiled"], 160);

    lastPrompt = data.optimized_prompt;
    renderResult(data);
    if (data.diary && data.diary.logged) {
      append(`<span class="b">[diary ✓]</span> marked in logs/daily_log.md · streak <span class="ye">${data.diary.streak_days}d</span>`, "diaryline");
    }
    busy = false;
    input.focus();
  };

  const autoGrow = () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, window.innerHeight * 0.4) + "px";
  };

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      run();
      return;
    }
    if (e.key === "ArrowUp" && !input.value.includes("\n")) {
      if (histIdx > 0) { histIdx--; input.value = history[histIdx] || ""; autoGrow(); }
      e.preventDefault();
      return;
    }
    if (e.key === "ArrowDown" && !input.value.includes("\n")) {
      if (histIdx < history.length) { histIdx++; input.value = history[histIdx] || ""; autoGrow(); }
      e.preventDefault();
    }
  });
  input.addEventListener("input", autoGrow);

  copyBtn.addEventListener("click", async () => {
    if (!lastPrompt) return;
    try {
      await navigator.clipboard.writeText(lastPrompt);
    } catch {
      const ta = document.createElement("textarea");
      ta.value = lastPrompt;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
    copyBtn.textContent = "[ copied ✓ ]";
    copyBtn.classList.add("flash");
    setTimeout(() => {
      copyBtn.textContent = "[ copy ]";
      copyBtn.classList.remove("flash");
    }, 900);
  });

  clearBtn.addEventListener("click", () => {
    screen.innerHTML = "";
    lastPrompt = "";
    boot();
    input.focus();
  });

  logBtn.addEventListener("click", showLog);

  const boot = () => {
    append(BANNER, "banner");
    append("&nbsp;", "line");
    append("<span class='dim'>raw idea in — top 1% prompt out. no cloud, no keys.</span>", "line");
    append("&nbsp;", "line");
    append("<span class='dim'>usage:</span> type or paste your idea (multi-line ok) and press <span class='dim' style='color:var(--yellow)'>enter</span>", "line");
    append("<span class='dim'>diary:</span> <span style='color:var(--yellow)'>/log</span> what you did | how much   ·   <span style='color:var(--yellow)'>/today</span> view the daily log", "line");
    append("&nbsp;", "line");
  };

  boot();
  input.focus();
})();
</script>
</body>
</html>
